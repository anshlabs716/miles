Name: MILES
AutoName: MILES
Summary: Privacy-first activity tracker with real GPS, health data and no ads
Description: |
  MILES is a privacy-first activity and step tracker for Android. Every number
  it shows comes from real sensors — the pedometer, GPS and your own heart rate
  — or it is not shown at all.

  Features:
  • Real step counting and GPS activity tracking
  • Turn-by-turn navigation with voice guidance
  • Saved routes and a route builder
  • Progressive training plans
  • Heart rate, cadence and barometer support, plus Bluetooth heart-rate straps
  • Daily calories, distance and active minutes from real measured activity
  • Resting heart rate and personal records
  • Fitness pet, weekly goals and badges
  • Local database with export and backup in standard formats (GPX, CSV, JSON)

  Privacy:
  • No ads
  • No account required — not a MILES account, not a Google account
  • No mandatory analytics or telemetry
  • Activity data stays on your device and can be exported or deleted at any time

  No Google Play Services required. Maps use OpenStreetMap data.
