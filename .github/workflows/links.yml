name: Links

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429
            './**/*.md'
          fail: false
