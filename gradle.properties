# Project-wide Gradle settings.
# This machine has 8 GB of RAM and has been OOM-killed during builds, so the
# defaults here are deliberately conservative rather than fast.
# IDE (e.g. Android Studio) users: IDE settings override anything set here.

# Modest heap. Raising this causes the kernel OOM killer to take the build out.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Single worker, no parallel execution, no configuration cache.
# This roughly halves peak CPU and RAM compared with the Gradle defaults.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false

# Run the Kotlin compiler inside the Gradle process instead of forking a second
# JVM, so we do not pay for two heaps at once.
kotlin.compiler.execution.strategy=in-process

kotlin.code.style=official
android.nonTransitiveRClass=true

# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
